[platformio]
default_envs = esp32dev

[env]
lib_ldf_mode = deep+

[env:esp32dev]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
build_unflags =
  -std=gnu++11
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@7.4.3
  ricmoo/QRCode@0.0.1
build_flags =
  -std=gnu++17
  -D CORE_DEBUG_LEVEL=1
  -D USER_SETUP_LOADED=1
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=27
  -D TFT_BACKLIGHT_ON=HIGH
  -D TOUCH_CS=33
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SPI_FREQUENCY=40000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -D TFT_RGB_ORDER=TFT_BGR
  -D USE_HSPI_PORT
  -D ESPBARCODE_VERSION=\"0.1.0\"

[env:native]
platform = native
test_framework = unity
test_build_src = false
lib_compat_mode = off
lib_deps =
  ricmoo/QRCode@0.0.1
build_flags =
  -std=gnu++17
  -D ESPBARCODE_NATIVE=1
