name: .NET CI

on:
  push:
    branches: ["main"]
    paths:
      - "dotnet/**"
      - ".github/workflows/dotnet-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "dotnet/**"
      - ".github/workflows/dotnet-ci.yml"

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore EspScreenBarcodeGenerator.slnx

      - name: Build
        run: dotnet build EspScreenBarcodeGenerator.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test EspScreenBarcodeGenerator.slnx --no-build --configuration Release --verbosity normal
