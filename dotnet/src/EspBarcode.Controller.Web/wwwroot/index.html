<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ESP Barcode Control</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
        (() => {
            let theme = 'dark';
            try {
                theme = JSON.parse(localStorage.getItem('esp-controller.theme')) === 'light' ? 'light' : 'dark';
            } catch { /* Storage can be unavailable in private or locked-down contexts. */ }
            document.documentElement.dataset.esbTheme = theme;
            document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f4f5f6' : '#0b0c0e';
        })();
    </script>
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="EspBarcode.Controller.Web.styles.css" rel="stylesheet" /> -->
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <main class="esb-loader" role="status" aria-live="polite" aria-label="Loading ESP Barcode Control">
            <div class="esb-loader-card">
                <div class="esb-loader-brand"><span class="esb-loader-dot"></span>ESP Barcode Control</div>
                <div class="esb-loader-screen" aria-hidden="true">
                    <div class="esb-loader-barcode"></div>
                    <div class="esb-loader-scanline"></div>
                    <div class="esb-loader-corners"></div>
                </div>
                <div class="esb-loader-copy">
                    <strong>Starting controller</strong>
                    <span>Preparing nearby screen controls…</span>
                </div>
                <div class="loading-progress" aria-hidden="true"><span></span></div>
                <div class="loading-progress-text"></div>
            </div>
        </main>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js');</script>
</body>

</html>
